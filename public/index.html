<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arix Gaming Portal | Home</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg-color: #0b0f19; --card-bg: #131b2e; --accent-cyan: #00f2fe; --accent-pink: #4facfe; --text-main: #f1f5f9; --text-dim: #94a3b8; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Rajdhani', sans-serif; background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .wrapper { width: 100%; max-width: 700px; background: var(--card-bg); border: 1px solid rgba(0, 242, 254, 0.2); border-radius: 16px; padding: 40px; text-align: center; box-shadow: 0 0 30px rgba(0,0,0,0.8); }
        h1 { font-family: 'Orbitron', sans-serif; font-size: 2.2rem; background: linear-gradient(135deg, #00f2fe, #4facfe); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 15px; }
        p { color: var(--text-dim); margin-bottom: 25px; font-size: 1.1rem; }
        .btn { background: linear-gradient(135deg, #00f2fe, #4facfe); color: #030712; font-family: 'Orbitron', sans-serif; font-weight: 700; padding: 14px 28px; border: none; border-radius: 8px; cursor: pointer; text-decoration: none; display: inline-block; text-transform: uppercase; }
        .btn:hover { box-shadow: 0 0 20px rgba(0, 242, 254, 0.5); }
    </style>
</head>
<body>
<div class="wrapper">
    <h1>ARIX GAMING HUB</h1>
    <p>Official Theme Installer & Management Portal</p>
    <a href="/admin" class="btn">Go to Admin Dashboard 🛡️</a>
</div>
</body>
</html>
